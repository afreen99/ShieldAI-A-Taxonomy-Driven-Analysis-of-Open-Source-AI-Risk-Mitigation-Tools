<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Risk Mitigation Tool Coverage Dashboard</title>
  <meta name="description" content="Standalone AI risk mitigation dashboard with coverage heatmap, tool breadth, gap density, and lifecycle mapping." />
  <style>
    :root {
      --background: 220 20% 6%;
      --foreground: 210 20% 92%;
      --card: 220 18% 10%;
      --primary: 160 80% 55%;
      --secondary: 220 15% 16%;
      --secondary-foreground: 210 20% 80%;
      --muted: 220 15% 14%;
      --muted-foreground: 215 12% 50%;
      --accent: 270 70% 65%;
      --destructive: 0 72% 55%;
      --border: 220 15% 18%;
      --warning: 38 92% 55%;
      --font-display: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      font-family: var(--font-body);
      min-width: 320px;
    }
    h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: 0; }
    .page { min-height: 100vh; background: hsl(var(--background)); }
    .topbar { border-bottom: 1px solid hsl(var(--border)); padding: 24px; }
    .topbar h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 800; background-image: linear-gradient(135deg, hsl(var(--primary)), hsl(var(--accent))); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .topbar p { margin: 4px 0 0; color: hsl(var(--muted-foreground)); font-size: 14px; }
    main { max-width: 1440px; margin: 0 auto; padding: 24px; display: grid; gap: 24px; }
    .card { border: 1px solid hsl(var(--border)); background: hsl(var(--card)); border-radius: 8px; padding: 20px; }
    .card.compact { padding: 16px; overflow-x: auto; }
    .section-title { font-size: 18px; font-weight: 800; color: hsl(var(--foreground)); margin-bottom: 16px; }
    .subtitle { margin: -8px 0 16px; color: hsl(var(--muted-foreground)); font-size: 12px; line-height: 1.45; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .stat { border: 1px solid hsl(var(--border)); background: hsl(var(--card)); border-radius: 8px; padding: 18px; }
    .stat-label { color: hsl(var(--muted-foreground)); font-family: var(--font-display); text-transform: uppercase; font-size: 10px; letter-spacing: .08em; }
    .stat-value { margin-top: 8px; color: hsl(var(--primary)); font-family: var(--font-display); font-size: 32px; font-weight: 800; line-height: 1; }
    .stat:nth-child(2) .stat-value { color: hsl(var(--destructive)); }
    .stat:nth-child(3) .stat-value { color: hsl(var(--accent)); }
    .stat:nth-child(4) .stat-value { color: hsl(var(--warning)); }
    .stat-sub { margin-top: 6px; color: hsl(var(--muted-foreground)); font-size: 12px; }
    .broad-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .broad-item { border: 1px solid hsl(var(--border)); background: hsl(var(--secondary) / .5); border-radius: 6px; padding: 12px; text-align: center; }
    .ring { width: 56px; height: 56px; margin: 0 auto 8px; position: relative; }
    .ring svg { width: 56px; height: 56px; transform: rotate(-90deg); }
    .ring text, .ring span { position: absolute; inset: 0; display: grid; place-items: center; font: 800 12px var(--font-display); }
    .broad-name { color: hsl(var(--secondary-foreground)); font: 600 11px/1.25 var(--font-display); min-height: 28px; }
    .broad-count { color: hsl(var(--muted-foreground)); font-size: 9px; margin-top: 2px; }
    .heatmap-inner { min-width: 960px; }
    .heat-headers { display: flex; align-items: end; margin-bottom: 0; }
    .cat-spacer, .cat-label { width: 192px; flex: 0 0 192px; }
    .tool-header { width: 34px; height: 176px; flex: 0 0 34px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 1px; color: hsl(var(--muted-foreground)); font: 500 9px/1 var(--font-display); }
    .tool-header span { writing-mode: vertical-rl; text-orientation: mixed; white-space: nowrap; }
    .heat-rows { display: grid; gap: 2px; margin-top: 0; }
    .heat-row { display: flex; align-items: center; }
    .cat-label { padding-right: 8px; color: hsl(var(--secondary-foreground)); font: 500 10px/1.2 var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cell { width: 32px; height: 24px; flex: 0 0 32px; margin: 0 1px; border-radius: 3px; background: hsl(var(--muted)); cursor: crosshair; position: relative; }
    .cell.covered { background: hsl(var(--primary) / .8); }
    .cell:hover { outline: 1px solid hsl(var(--primary) / .5); background: hsl(var(--primary)); }
    .row-count { margin-left: 8px; width: 24px; text-align: right; color: hsl(var(--muted-foreground)); font: 500 10px var(--font-display); }
    .tooltip { position: fixed; z-index: 50; max-width: 360px; pointer-events: none; border: 1px solid hsl(var(--border)); border-radius: 6px; background: hsl(220 18% 9%); box-shadow: 0 16px 50px hsl(0 0% 0% / .35); color: hsl(var(--foreground)); padding: 10px 12px; font-size: 12px; line-height: 1.4; display: none; }
    .tooltip strong { font-family: var(--font-display); }
    .tooltip .muted { color: hsl(var(--muted-foreground)); }
    .tooltip .ok { color: hsl(var(--primary)); }
    .tooltip .gap { color: hsl(var(--destructive)); }
    .two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .bars { display: grid; gap: 8px; }
    .bar-row { display: flex; align-items: center; gap: 12px; }
    .bar-label { width: 144px; flex: 0 0 144px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; color: hsl(var(--secondary-foreground)); font: 500 11px var(--font-display); }
    .bar-track { height: 20px; flex: 1; overflow: hidden; border-radius: 3px; background: hsl(var(--muted)); }
    .bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, hsl(var(--primary) / .7), hsl(var(--primary))); }
    .bar-fill.gap { background: hsl(var(--destructive)); }
    .bar-fill.low { background: hsl(var(--warning)); }
    .bar-value { width: 54px; text-align: right; color: hsl(var(--primary)); font: 800 12px var(--font-display); }
    .bar-value.gap { color: hsl(var(--destructive)); }
    .bar-value.low { color: hsl(var(--warning)); }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; color: hsl(var(--muted-foreground)); font: 500 10px var(--font-display); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .dot.red { background: hsl(var(--destructive)); } .dot.yellow { background: hsl(var(--warning)); } .dot.green { background: hsl(var(--primary)); }
    .layers { display: grid; gap: 16px; }
    .layer { border: 1px solid; border-radius: 8px; padding: 16px; box-shadow: 0 0 20px var(--glow); }
    .layer-head { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
    .layer-icon { width: 30px; height: 30px; border: 1px solid; border-radius: 6px; display: grid; place-items: center; font-size: 16px; }
    .layer-num { color: hsl(var(--muted-foreground)); font: 600 10px var(--font-display); text-transform: uppercase; letter-spacing: .08em; }
    .layer h3 { font-size: 14px; font-weight: 700; line-height: 1.2; }
    .mini-label { display: block; color: hsl(var(--muted-foreground)); font: 600 10px var(--font-display); text-transform: uppercase; letter-spacing: .08em; margin-top: 12px; }
    .layer p, .layer li { color: hsl(var(--foreground) / .8); font-size: 12px; line-height: 1.55; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chip { border: 1px solid; background: hsl(var(--background) / .5); border-radius: 999px; padding: 3px 8px; font: 500 11px var(--font-display); }
    .layer ul { margin: 6px 0 0; padding-left: 18px; color: hsl(var(--muted-foreground)); }
    .arrow { display: flex; align-items: center; justify-content: center; flex-direction: column; color: hsl(var(--muted-foreground)); font-size: 14px; }
    .arrow::before { content: ''; width: 1px; height: 24px; background: hsl(var(--muted-foreground) / .3); display: block; }
    footer { text-align: center; color: hsl(var(--muted-foreground)); font: 500 10px var(--font-display); padding: 12px 0 24px; }
    @media (max-width: 900px) { .stats, .broad-grid, .two-col { grid-template-columns: repeat(2, minmax(0, 1fr)); } main { padding: 16px; } }
    @media (max-width: 640px) { .stats, .broad-grid, .two-col { grid-template-columns: 1fr; } .topbar { padding: 20px 16px; } }
    @media print { body { background: white; } .page { background: white; } .card, .stat { break-inside: avoid; } }
  </style>
</head>

 "", "WildGuard": "", "OpenGuardrails": "", "Evidently": "", "OpenLIT": "", "Arize Phoenix": "", "Adversarial Robustness Toolbox": "", "ModelScan": "", "Diffprivlib": "", "PrivacyRaven": "", "Holistic AI": "", "Langfuse": "", "Giskard": "", "Innodata": ""}}]}</script>
  <script>
    const DATA = JSON.parse(document.getElementById('dashboard-data').textContent);
    const TOOLS = DATA.tools;
    const categories = DATA.categories;
    const app = document.getElementById('app');
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const toolCount = (cat) => TOOLS.filter(t => cat.coverage[t]).length;
    const totalCells = categories.length * TOOLS.length;
    const coveredCells = categories.reduce((sum, c) => sum + toolCount(c), 0);
    const totalCoverage = Math.round((coveredCells / totalCells) * 100);
    const breadth = TOOLS.map(tool => ({ tool, count: categories.filter(c => c.coverage[tool]).length })).sort((a,b) => b.count - a.count);
    const gaps = categories.map(c => ({ ...c, toolCount: toolCount(c) })).sort((a,b) => a.toolCount - b.toolCount);
    const topTool = breadth[0];
    document.getElementById('intro').textContent = `Mapping ${TOOLS.length} open-source tools against ${categories.length} AI risk taxonomy categories`;

    function cleanBroad(label) { return String(label || 'Other').replace(/^\d+\.\s*/, ''); }
    function broadCoverage() {
      const groups = [];
      categories.forEach(c => {
        let g = groups.find(x => x.raw === c.broadCategory);
        if (!g) { g = { raw: c.broadCategory, categories: [] }; groups.push(g); }
        g.categories.push(c);
      });
      return groups.map(g => {
        const cells = g.categories.length * TOOLS.length;
        const covered = g.categories.reduce((sum, c) => sum + toolCount(c), 0);
        return { broadCategory: cleanBroad(g.raw), categories: g.categories.length, coverage: cells ? Math.round((covered / cells) * 100) : 0 };
      });
    }
    function ringColor(pct) { return pct > 30 ? 'hsl(var(--primary))' : pct > 0 ? 'hsl(var(--warning))' : 'hsl(var(--destructive))'; }
    function statCard(label, value, sub) { return `<div class="stat"><div class="stat-label">${esc(label)}</div><div class="stat-value">${esc(value)}</div><div class="stat-sub">${esc(sub)}</div></div>`; }
    function renderStats() {
      return `<section class="stats">${statCard('Total Coverage', totalCoverage + '%', 'of all tool×category cells')}${statCard('Full Gaps', categories.filter(c => toolCount(c) === 0).length, 'categories with zero tools')}${statCard('Top Tool', topTool.count, topTool.tool)}${statCard('Tools Analyzed', TOOLS.length, categories.length + ' risk categories')}</section>`;
    }
    function renderBroad() {
      return `<section class="card"><h2 class="section-title">Coverage by Broad Category</h2><div class="broad-grid">${broadCoverage().map(d => `
        <div class="broad-item">
          <div class="ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9" fill="none" stroke="hsl(var(--muted))" stroke-width="3"></circle><circle cx="18" cy="18" r="15.9" fill="none" stroke="${ringColor(d.coverage)}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${d.coverage}, 100"></circle></svg><span>${d.coverage}%</span></div>
          <div class="broad-name">${esc(d.broadCategory)}</div><div class="broad-count">${d.categories} categories</div>
        </div>`).join('')}</div></section>`;
    }
    function renderHeatmap() {
      return `<section class="card compact"><h2 class="section-title">Coverage Heatmap</h2><div class="heatmap-inner">
        <div class="heat-headers"><div class="cat-spacer"></div>${TOOLS.map(tool => `<div class="tool-header"><span>${esc(tool)}</span></div>`).join('')}</div>
        <div class="heat-rows">${categories.map(cat => `<div class="heat-row"><div class="cat-label" title="${esc(cat.fullName)}">${esc(cat.id)} ${esc(cat.name.length > 22 ? cat.name.slice(0,22) + '…' : cat.name)}</div>${TOOLS.map(tool => `<div class="cell${cat.coverage[tool] ? ' covered' : ''}" data-tool="${esc(tool)}" data-cat="${esc(cat.fullName)}" data-covered="${cat.coverage[tool] ? 'true' : 'false'}" data-cap="${esc(cat.capabilities[tool] || '')}"></div>`).join('')}<div class="row-count">${toolCount(cat)}</div></div>`).join('')}</div>
      </div></section>`;
    }
    function renderBreadth() {
      const max = Math.max(...breadth.map(d => d.count));
      return `<section class="card"><h2 class="section-title" style="margin-bottom:4px">Tool Breadth</h2><p class="subtitle">Risk categories covered per tool</p><div class="bars">${breadth.map(d => `<div class="bar-row"><div class="bar-label" title="${esc(d.tool)}">${esc(d.tool)}</div><div class="bar-track"><div class="bar-fill" style="width:${(d.count/max)*100}%"></div></div><div class="bar-value">${d.count}/${categories.length}</div></div>`).join('')}</div></section>`;
    }
    function renderGaps() {
      return `<section class="card"><h2 class="section-title" style="margin-bottom:4px">Gap & Density Analysis</h2><p class="subtitle">Categories ranked by tool coverage (lowest first)</p><div class="bars">${gaps.map(d => {
        const pct = Math.round((d.toolCount / TOOLS.length) * 100);
        const cls = d.toolCount === 0 ? 'gap' : d.toolCount <= 3 ? 'low' : '';
        const label = `${d.id} ${d.name.length > 20 ? d.name.slice(0,20) + '…' : d.name}`;
        return `<div class="bar-row"><div class="bar-label" title="${esc(d.fullName)}">${esc(label)}</div><div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div><div class="bar-value ${cls}">${d.toolCount}</div></div>`;
      }).join('')}</div><div class="legend"><span><i class="dot red"></i>No coverage</span><span><i class="dot yellow"></i>Low (1-3)</span><span><i class="dot green"></i>Good (4+)</span></div></section>`;
    }
    const layers = [
      { id: 1, title: 'Technical control layer', icon: '⚙', color: 'primary', focus: 'Model infrastructure security (2.1), model alignment (2.2), model safety engineering (2.3), content safety controls (2.4).', tools: ['Promptfoo','Garak','PyRIT','NeMo Guardrails','LLM Guard','OpenGuardrails','ModelScan','ART','Diffprivlib','PrivacyRaven'], functions: ['Promptfoo, Garak, PyRIT for pre-deployment evaluation and red teaming — probing jailbreaks, harmful content and data exfiltration before release.','NeMo Guardrails, LLM Guard, OpenGuardrails as middleware around LLM endpoints — enforcing I/O filtering, refusal policies and prompt-injection detection.','ModelScan, ART, Diffprivlib, PrivacyRaven for model/infra scanning, robustness tests, membership inference and data-leakage risk analysis.'] },
      { id: 2, title: 'Observability and operations layer', icon: '▥', color: 'accent', focus: 'Testing & auditing (3.1), data governance (3.2), post-deployment monitoring (3.5), incident response and recovery (3.6).', tools: ['Langfuse','Arize Phoenix','OpenLIT','Promptfoo','DeepEval'], functions: ['Langfuse as tracing/logging spine for all LLM calls — prompts, responses, metadata, guardrail signals.','Arize Phoenix / OpenLIT for evaluation-aware monitoring — surfacing hallucination, toxicity, drift and regressions in dashboards.','Promptfoo / DeepEval as scheduled regression and safety tests against staging/canary endpoints.','PII and leakage detectors integrated into ETL/logging — alerts wired to incident workflows and rollbacks.'] },
      { id: 3, title: 'Organizational governance layer', icon: '▦', color: 'warning', focus: 'Governance oversight and transparency/accountability controls (1.x, 4.x).', tools: ['Policies','Processes','Committees'], functions: ['Board and risk committees, model risk policies, safety decision frameworks.','Whistleblower protections and internal incident/disclosure processes.','Publication of governance and transparency reports.'] },
      { id: 4, title: 'Regulatory and market layer', icon: '⚖', color: 'destructive', focus: 'Legal and regulatory enforcement actions, and financial/market controls (6.x–7.x).', tools: ['Regulators','Supervisors','Market controls'], functions: ['Supervisory expectations and enforcement; administrative fines.','Mandatory reporting obligations and consumer compensation / restitution frameworks.','Market-access restrictions and moratoria.'] }
    ];
    function colorVars(color) {
      const map = { primary: ['hsl(var(--primary) / .1)','hsl(var(--primary) / .4)','hsl(var(--primary))','hsl(var(--primary) / .15)'], accent: ['hsl(var(--accent) / .1)','hsl(var(--accent) / .4)','hsl(var(--accent))','hsl(var(--accent) / .15)'], warning: ['hsl(var(--warning) / .1)','hsl(var(--warning) / .4)','hsl(45 90% 60%)','hsl(var(--warning) / .15)'], destructive: ['hsl(var(--destructive) / .1)','hsl(var(--destructive) / .4)','hsl(var(--destructive))','hsl(var(--destructive) / .15)'] };
      return map[color];
    }
    function renderLayers() {
      return `<section class="card"><h2 class="section-title" style="margin-bottom:4px">Four-layer architecture aligning tools with the extended AI risk mitigation taxonomy</h2><p class="subtitle">Four-layer defense: Technical control → Observability and operation → Organizational governance → Regulatory and market</p><div class="layers">${layers.map((l,i) => {
        const [bg,border,text,glow] = colorVars(l.color);
        return `<div class="layer" style="background:${bg}; border-color:${border}; --glow:${glow}"><div class="layer-head"><div class="layer-icon" style="border-color:${border}; color:${text}; background:${bg}">${l.icon}</div><div><div class="layer-num">Layer ${l.id}</div><h3 style="color:${text}">${esc(l.title)}</h3></div></div><span class="mini-label">Risk taxonomy focus</span><p>${esc(l.focus)}</p><span class="mini-label">Tools</span><div class="chips">${l.tools.map(t => `<span class="chip" style="border-color:${border}; color:${text}">${esc(t)}</span>`).join('')}</div><span class="mini-label">Functions</span><ul>${l.functions.map(fn => `<li>${esc(fn)}</li>`).join('')}</ul></div>${i < layers.length - 1 ? '<div class="arrow">▼</div>' : ''}`;
      }).join('')}</div></section>`;
    }
    app.innerHTML = renderStats() + renderBroad() + renderHeatmap() + `<section class="two-col">${renderBreadth()}${renderGaps()}</section>` + renderLayers() + `<footer>Data source: AI Risk Mitigation V2 — Technical Capability Mapping</footer>`;

    const tip = document.getElementById('tooltip');
    document.querySelectorAll('.cell').forEach(cell => {
      cell.addEventListener('mouseenter', () => {
        const covered = cell.dataset.covered === 'true';
        tip.innerHTML = `<strong>${esc(cell.dataset.tool)}</strong><br><span class="muted">${esc(cell.dataset.cat)}</span><br><span class="${covered ? 'ok' : 'gap'}">${covered ? '✓ Covered' : '✗ Gap'}</span>${covered && cell.dataset.cap ? `<br><span>${esc(cell.dataset.cap)}</span>` : ''}`;
        tip.style.display = 'block';
      });
      cell.addEventListener('mousemove', (e) => {
        const pad = 14;
        const rect = tip.getBoundingClientRect();
        let x = e.clientX + pad, y = e.clientY + pad;
        if (x + rect.width > window.innerWidth - 8) x = e.clientX - rect.width - pad;
        if (y + rect.height > window.innerHeight - 8) y = e.clientY - rect.height - pad;
        tip.style.left = x + 'px'; tip.style.top = y + 'px';
      });
      cell.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    });
  </script>
